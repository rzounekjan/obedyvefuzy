name: Nasazení Rytmus Stolu na GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Stažení repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Konfigurace GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instalace závislostí
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Sestavení produkční PWA verze pro GitHub Pages
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER_LOWER: ${{ github.repository_owner }}
        run: |
          if [[ "${REPO_NAME,,}" == "${OWNER_LOWER,,}.github.io" ]]; then
            export BASE_PATH="/"
          else
            export BASE_PATH="/${REPO_NAME}/"
          fi
          echo "Použitý BASE_PATH=${BASE_PATH}"
          rm -rf public/assets/aistudio
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Nahrání artefaktu pro GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Nasazení na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
